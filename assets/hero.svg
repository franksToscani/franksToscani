<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Animated software architecture: clients send requests through an API layer to services and databases">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d2a44" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .box{fill:#132038;stroke:#2f4a74;stroke-width:1.5}
      .lbl{fill:#cfe0ff;font-size:15px;font-weight:600}
      .sub{fill:#7f97bd;font-size:12px}
      .wire{stroke:#2f4a74;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity=".6"/>

  <!-- title -->
  <text x="60" y="84" class="t" fill="#ffffff" font-size="40" font-weight="700">Franks Toscani Koudja</text>
  <text x="60" y="118" class="t" fill="#8fb4ff" font-size="18">Backend Developer · Software Engineering · Software Architecture</text>
  <text x="60" y="150" class="t" fill="#5f7aa3" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">$ composing modular systems<tspan class="blink" fill="#8fb4ff">_</tspan></text>

  <!-- architecture -->
  <g class="t">
    <rect x="60" y="200" width="150" height="70" rx="10" class="box"/>
    <text x="135" y="232" text-anchor="middle" class="lbl">Clients</text>
    <text x="135" y="252" text-anchor="middle" class="sub">web · PWA · mobile</text>

    <rect x="300" y="200" width="160" height="70" rx="10" class="box"/>
    <text x="380" y="232" text-anchor="middle" class="lbl">REST API</text>
    <text x="380" y="252" text-anchor="middle" class="sub">auth · validation</text>

    <rect x="550" y="170" width="170" height="60" rx="10" class="box"/>
    <text x="635" y="198" text-anchor="middle" class="lbl">Services</text>
    <text x="635" y="216" text-anchor="middle" class="sub">business logic</text>

    <rect x="550" y="250" width="170" height="60" rx="10" class="box"/>
    <text x="635" y="278" text-anchor="middle" class="lbl">Events</text>
    <text x="635" y="296" text-anchor="middle" class="sub">on-chain listener</text>

    <rect x="810" y="170" width="150" height="60" rx="10" class="box"/>
    <text x="885" y="198" text-anchor="middle" class="lbl">Cache</text>
    <text x="885" y="216" text-anchor="middle" class="sub">in-memory</text>

    <rect x="810" y="250" width="150" height="60" rx="10" class="box"/>
    <text x="885" y="278" text-anchor="middle" class="lbl">Database</text>
    <text x="885" y="296" text-anchor="middle" class="sub">PostgreSQL · MySQL</text>

    <rect x="1040" y="210" width="110" height="60" rx="10" class="box"/>
    <text x="1095" y="238" text-anchor="middle" class="lbl">Storage</text>
    <text x="1095" y="256" text-anchor="middle" class="sub">S3 objects</text>
  </g>

  <path id="w1" d="M210 235 H300" class="wire"/>
  <path id="w2" d="M460 235 C505 235 505 200 550 200" class="wire"/>
  <path id="w3" d="M460 235 C505 235 505 280 550 280" class="wire"/>
  <path id="w4" d="M720 200 H810" class="wire"/>
  <path id="w5" d="M720 280 H810" class="wire"/>
  <path id="w6" d="M885 230 V250" class="wire"/>
  <path id="w7" d="M960 280 C1000 280 1000 240 1040 240" class="wire"/>

  <!-- packets -->
  <g fill="#5eead4">
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M210 235 H300 C 330 235 330 235 460 235 C505 235 505 200 550 200 H720 H810"/></circle>
    <circle r="5" fill="#fbbf24"><animateMotion dur="3.6s" repeatCount="indefinite" path="M210 235 H460 C505 235 505 280 550 280 H720 H810 C 860 280 860 280 960 280 C1000 280 1000 240 1040 240"/></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="2.8s" repeatCount="indefinite" path="M810 200 H720 H550 C505 200 505 235 460 235 H210"/></circle>
  </g>

  <g class="pulse">
    <circle cx="1095" cy="120" r="46" fill="none" stroke="#2f4a74" stroke-width="1.5"/>
    <circle cx="1095" cy="120" r="30" fill="none" stroke="#3b5d91" stroke-width="1.5"/>
    <circle cx="1095" cy="120" r="8" fill="#8fb4ff"/>
  </g>
</svg>
